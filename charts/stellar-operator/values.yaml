# Default values for stellar-operator
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/stellar/stellar-k8s
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

hooks:
  preInstall:
    enabled: false
  preUpgrade:
    enabled: false
    enableRollbackCheck: false

webhook:
  enabled: false
  # Whether cert-manager pulls in the TLS certificate for the webhook.
  # When false, the caBundle must be injected manually.
  certManager:
    enabled: false

# ── WASM Bytecode Optimizer Sidecar (issue #325) ─────────────────────────────
# Deploys the wasm-opt Alpine sidecar and a MutatingWebhookConfiguration that
# intercepts StellarNode WASM deployments, optimises the bytecode, and replaces
# the payload with the reduced binary.  Requires webhook.enabled=true.
wasmOptimizer:
  enabled: false
  # Optimisation level passed to wasm-opt (0=none … 4=aggressive, z=size).
  optLevel: "3"
  # Hard cap on the optimisation step; must be < webhookTimeoutSeconds.
  timeoutSecs: "8"
  # Kubernetes admission webhook timeout (max 10 s per K8s spec).
  webhookTimeoutSeconds: 10
  # Ignore = fail-open; optimizer failures never block deployments.
  failurePolicy: "Ignore"
  replicaCount: 2
  sidecar:
    image: "ghcr.io/stellar/wasm-opt-sidecar:latest"
    pullPolicy: IfNotPresent
  serviceAccount:
    annotations: {}
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ── Vault Validator Seed Injector (issue #224) ─────────────────────────────
# Registers a MutatingWebhookConfiguration that intercepts Stellar Core pods
# annotated `stellar.io/vault-injection: "enabled"` and injects a Vault-backed
# init container plus a memory-only tmpfs volume carrying the generated
# stellar-core.cfg.  Requires webhook.enabled=true.
vaultInjector:
  enabled: false
  # Kubernetes admission webhook timeout (max 10 s per K8s spec).
  webhookTimeoutSeconds: 10
  # Ignore = fail-open; injector failures never block node startup.
  failurePolicy: "Ignore"
  # Extra namespaces the injector must never intercept.
  skipNamespaces: []

# ── Monitoring (ServiceMonitor / PodMonitor / PrometheusRule / dashboards) ─
# Templates reference these unconditionally; disabled by default.
monitoring:
  enabled: false
  grafanaDashboards:
    enabled: false
    labels: {}
  podMonitor:
    enabled: false
    interval: 30s
    portName: metrics
    wasmCachePortName: wasm-cache-metrics
    labels: {}
    selector:
      matchExpressions: []
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    ledgerCloseTimeThresholdSeconds: 5
    ingestionLagThresholdSeconds: 60
    additionalRules: []
    certAlerts:
      criticalDays: 3
      warningDays: 30
    costAlerts: {}
    rateLimitAlerts: {}

# SCP analytics sidecar (scp-kafka-sidecar.yaml); disabled by default.
scpAnalytics:
  enabled: false
  kafka:
    bootstrapServers: []
    topic: ""
    schemaRegistryUrl: ""
    pollIntervalSecs: 5
    lingerMs: 100
    batchSize: 200
    compression: snappy
    format: json
    enableDeduplication: true
    sasl:
      mechanism: PLAIN
      username: ""
      password: ""
  consumer:
    replicas: 1
    groupId: stellar-scp-analytics
    logLevel: info
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    podSecurityContext: {}

# GitOps secret sidecar toggle (deployment.yaml templates).
gitopsSecrets:
  enabled: false

# Custom WASM-based HPA for Horizon nodes (hpa-horizon.yaml).
horizonHpa:
  enabled: false

mtls:
  enabled: false

certManagement:
  enabled: false

horizon-hpa:
  enabled: false

rateLimiting:
  enabled: false
  distributed:
    enabled: false
    failOpen: true
  redis:
    address: ""
    poolSize: 10
    timeoutMs: 1000
    tls:
      enabled: false
    passwordSecretName: ""
    passwordSecretKey: "password"
  tiers: []
  endpointTiers: {}

prometheus:
  enabled: false

logShipper:
  enabled: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

# Configuration for secrets
# It can generate standard Kubernetes Secrets or ExternalSecrets mapping to an external store
secrets:
  # Whether to create secret manifests
  create: false
  # Set to true to generate ExternalSecret manifests instead of standard Secret manifests
  useExternalSecrets: false
  # Applicable only when useExternalSecrets is true
  externalSecret:
    # the name of the SecretStore or ClusterSecretStore
    secretStoreRef:
      name: "aws-secrets"
      kind: "ClusterSecretStore"
    # the refresh interval for the ExternalSecret
    refreshInterval: "1h"
  # Define the secrets here
  # For useExternalSecrets: true, 'value' is used as the remoteRef key.
  # For useExternalSecrets: false, 'value' is base64 encoded into a standard K8s Secret.
  items: {}
  # Example:
  # items:
  #   validator-seed:
  #     key: STELLAR_CORE_SEED
  #     value: "my-validator-seed-value" # or remoteRef key if useExternalSecrets: true
  #   horizon-db:
  #     key: DATABASE_URL
  #     value: "my-db-url"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# Default: unprivileged. eBPF network telemetry (issue #470) needs CAP_BPF,
# CAP_PERFMON, and CAP_NET_ADMIN on the collector container when enabled; the
# operator falls back to standard Prometheus metrics if those caps are absent.
# See docs/ebpf-network-telemetry.md.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Custom WASM-based HPA for Soroban RPC workloads.
autoscaling:
  customWasm:
    enabled: false
    minReplicas: 1
    maxReplicas: 10

nodeSelector: {}

tolerations: []

affinity: {}

# Multi-architecture support
# Allows targeting specific CPU architectures (amd64 / arm64 / Graviton).
# Set arch to "arm64" to schedule on ARM/Graviton nodes, "amd64" for x86.
# Leave empty to allow scheduling on any architecture.
arch: ""

# Example — pin operator to ARM64 (Graviton) nodes:
# arch: arm64
# nodeSelector:
#   kubernetes.io/arch: arm64
# tolerations:
#   - key: "kubernetes.io/arch"
#     operator: "Equal"
#     value: "arm64"
#     effect: "NoSchedule"# Namespace watch scoping used by rbac.yaml (empty = cluster-wide).
watchNamespace: ""

# PodDisruptionBudget configuration for operator deployment
podDisruptionBudget:
  enabled: false
  # Only takes effect once enabled: true. Without a default here, enabling
  # the PDB would render neither minAvailable nor maxUnavailable, producing
  # no-op PodDisruptionBudget.
  minAvailable: 1

# Operator configuration
operator:
  # Log level: debug, info, warn, error
  logLevel: info
  # Enable REST API
  restApiEnabled: true
  # REST API port
  restApiPort: 9090
  # Metrics port
  metricsPort: 9090
  # Namespace to watch (empty = all namespaces)
  watchNamespace: ""
  profiling:
    enabled: false

# Diagnostic sidecar configuration
sidecar:
  enabled: true
  image:
    repository: ghcr.io/stellar/stellar-k8s
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

# Fork Detection Sidecar — compares local ledger hash against public anchors.
# Deploy alongside each StellarNode validator pod to detect network forks early.
forkDetector:
  enabled: false
  image:
    repository: ghcr.io/stellar/stellar-k8s
    tag: ""
    pullPolicy: IfNotPresent
  # Local Stellar Core endpoint (within the same pod).
  localEndpoint: "http://localhost:11626"
  # Public Horizon anchor endpoints (minimum 3 recommended).
  anchors:
    - "https://horizon.stellar.org/ledgers?order=desc&limit=1"
    - "https://horizon.stellar.lobstr.co/ledgers?order=desc&limit=1"
    - "https://horizon.satoshipay.io/ledgers?order=desc&limit=1"
  # Poll interval in seconds.
  pollIntervalSecs: 5
  # Number of consecutive diverging ledgers before alerting.
  divergenceThreshold: 3
  # Prometheus metrics port.
  metricsPort: 9102
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 25m
      memory: 32Mi

# Service for REST API and metrics
service:
  type: ClusterIP
  restApiPort: 9090
  metricsPort: 9090

# Default resource requests/limits for managed StellarNode pods.
# Precedence: StellarNode spec.resources > Helm defaults > operator hardcoded fallback.
# These are written into a ConfigMap that the operator reads at startup.
defaultResources:
  validator:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  horizon:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"
  sorobanRpc:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# Feature flags — toggle operator capabilities at runtime without restart.
featureFlags:
  enableCveScanning: false
  enableReadPool: false
  enableDr: false
  enablePeerDiscovery: true
  enableArchiveHealth: true
  enableSorobanMetrics: false

costOptimization:
  resourceTracking:
    enabled: false
    windowSize: "7d"
    headroomFactor: 1.2
  spot:
    enabled: false
    maxPricePerHourUsd: "0"
    fallbackToOnDemand: true
  monthlyBudgetUsd: 0

# Validator key rotation daemon. Disabled by default; when enabled the operator
# rotates only Validator seed sources backed by supported external Secret Managers.
keyRotation:
  enabled: false
  intervalSecs: 86400
  validationWindowSecs: 30
  validationSampleIntervalSecs: 5
  minAuthenticatedPeers: 1
  maxUnhealthySamples: 0
  rollbackOnFailure: true
  awsRegion: ""

security:
  audit:
    enabled: true
    logLevel: Audit
  podSecurityStandard: restricted
  falco:
    enabled: true
  networkPolicy:
    enabled: true
    ingress:
      namespaceSelector: true
  admissionWebhook:
    failurePolicy: Fail
  imagePolicy:
    allowLatestTag: false

    internalSubnets: []

# Network Isolation — prevents cross-network traffic between Mainnet and Testnet namespaces.
#
# When enabled, the Helm chart deploys namespace-level NetworkPolicies that block
# all ingress and egress between namespaces labelled with different stellar.org/network
# values. This is a second layer of defence on top of the per-node NetworkPolicies
# generated by the operator reconciler.
#
# The operator reconciler also enforces isolation at the control-plane level:
# if a StellarNode is created in a namespace that already contains a node for a
# different network, reconciliation is blocked with error SK8S-021.
#
# Quick start:
#   1. Label your namespaces:
#        kubectl label namespace stellar-mainnet stellar.org/network=mainnet
#        kubectl label namespace stellar-testnet stellar.org/network=testnet
#   2. Set networkIsolation.enabled=true and list the namespaces below.
#   3. Helm upgrade.
networkIsolation:
  # Master switch. Set to true to deploy namespace-level isolation policies.
  enabled: false

  # When true, the Helm chart will patch the release namespace with the
  # stellar.org/network label specified in releaseNamespaceNetwork.
  labelReleaseNamespace: false

  # The network label value to apply to the release namespace.
  # Must be one of: mainnet, testnet, futurenet, or a custom-<hash> value.
  releaseNamespaceNetwork: ""

  # List of namespaces that host Mainnet nodes.
  # The chart will deploy deny-non-mainnet-ingress and deny-non-mainnet-egress
  # NetworkPolicies into each of these namespaces.
  mainnetNamespaces: []
  # Example:
  # mainnetNamespaces:
  #   - stellar-mainnet
  #   - stellar-mainnet-horizon#

  # List of namespaces that host Testnet nodes.
  testnetNamespaces: []
  # Example:
  # testnetNamespaces:
  #   - stellar-testnet
  #   - stellar-testnet-horizon

  # When true, ingress from and egress to the monitoring namespace is allowed
  # so Prometheus can scrape metrics from Stellar pods.
  allowMonitoringNamespace: true

  # The namespace where Prometheus / monitoring tools run.
  monitoringNamespace: "monitoring"

# Byzantine Monitoring Watcher configuration
#
# Deploys lightweight `stellar-watcher` sidecars in multiple geographic regions
# to detect local vs. global consensus issues (Byzantine partition detection).
#
# Each watcher independently polls a Stellar Core node and exports Prometheus
# metrics. A central Prometheus instance aggregates all watchers and fires an
# alert when >20% disagree on the current ledger hash.
#
# Quick start:
#   1. Enable the watcher: byzantineWatcher.enabled=true
#   2. Configure at least 3 regions for reliable detection.
#   3. Apply the PrometheusRule: kubectl apply -f monitoring/byzantine-alerts.yaml
#   4. Import the Grafana dashboard: monitoring/byzantine-dashboard.json
#
# See docs/byzantine-monitoring.md for full setup instructions.
byzantineWatcher:
  # Master switch. Set to true to deploy watcher Deployments.
  enabled: false

  # Container image for the watcher binary.
  # Defaults to the same image as the operator (stellar-watcher binary is included).
  image:
    repository: ""   # defaults to .Values.image.repository
    tag: ""          # defaults to .Values.image.tag / chart appVersion
    pullPolicy: IfNotPresent

  # Default Stellar network for all watchers (can be overridden per region).
  defaultNetwork: "mainnet"

  # How often each watcher polls its Stellar Core node (seconds).
  pollIntervalSecs: 10

  # HTTP request timeout for Stellar Core polls (seconds).
  requestTimeoutSecs: 5

  # Port for the Prometheus /metrics endpoint on each watcher pod.
  metricsPort: 9101

  # Log level for watcher pods.
  logLevel: "info"

  # Resource requests/limits for each watcher pod.
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 25m
      memory: 32Mi

  # List of geographic vantage points to deploy watchers in.
  # Each entry creates one Deployment + Service.
  #
  # Required fields per region:
  #   cloud:        Cloud provider label (aws / gcp / azure / on-prem)
  #   region:       Geographic region label (us-east-1 / eu-west-1 / …)
  #   nodeEndpoint: HTTP endpoint of the Stellar Core node to poll
  #
  # Optional fields per region:
  #   network:      Override defaultNetwork for this watcher
  #
  # Example — 5-region setup across 3 cloud providers:
  # regions:
  #   - cloud: aws
  #     region: us-east-1
  #     nodeEndpoint: http://stellar-core.stellar-system.svc.cluster.local:11626
  #   - cloud: aws
  #     region: us-west-2
  #     nodeEndpoint: http://stellar-core-usw2.stellar-system.svc.cluster.local:11626
  #   - cloud: gcp
  #     region: eu-west-1
  #     nodeEndpoint: http://stellar-core-eu.stellar-system.svc.cluster.local:11626
  #   - cloud: azure
  #     region: ap-south-1
  #     nodeEndpoint: http://stellar-core-ap.stellar-system.svc.cluster.local:11626
  #   - cloud: on-prem
  #     region: dc-frankfurt
  #     nodeEndpoint: http://10.0.1.50:11626
  regions: []

# OpenTelemetry configuration
# Controls OTLP trace export from the operator and the bundled OTel Collector.
otel:
  # Set to true to enable OTLP trace export from the operator.
  # When enabled, OTEL_EXPORTER_OTLP_ENDPOINT must be set to a valid collector address.
  enabled: false
  endpoint: ""
  # Bundled OpenTelemetry Collector (otel-collector.yaml).
  collector:
    enabled: false
    image:
      repository: "otel/opentelemetry-collector-contrib"
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    config:
      jaeger:
        enabled: false
        endpoint: ""
      tempo:
        enabled: false
        endpoint: ""
      loki:
        enabled: false
        endpoint: ""
      honeycomb:
        enabled: false
        endpoint: ""
        apiKeySecretRef: ""
      elasticsearch:
        enabled: false
        endpoint: ""
        index: ""

# Multi-Cluster Active-Passive Failover Operator
#
# Actively orchestrates global DNS, database replication, and Horizon availability
# across disparately hosted Kubernetes clusters to survive the complete loss of
# an AWS/GCP region.
#
# The operator polls the primary cluster's health endpoints every 500ms, and
# once the anti-flapping threshold is met, promotes the Patroni replica and

#
# Quick start:
#   1. Set failover.enabled=true
#   2. Configure the primary/passive cluster endpoints and DNS provider.
#   3. Helm upgrade.
#
# See docs/multi-cluster-failover.md for full setup instructions.
failover:
  # Master switch. Set to true to enable the multi-cluster failover operator.
  enabled: false

  # How often the global watcher polls the primary cluster's health endpoints.
  # The issue requires a 500ms poll interval.
  pollIntervalMs: 500

  # HTTP request timeout for each health probe (in milliseconds).
  requestTimeoutMs: 200

  # Number of consecutive failed health checks required before a failover
  # is initiated. This is the primary anti-flapping guard against momentary
  # network blips.
  failureThreshold: 3

  # Number of consecutive successful health checks required before the
  # operator will consider failing back to the primary cluster.
  recoveryThreshold: 6

  # Minimum time the operator must wait between two consecutive failover
  # operations. Prevents bouncing traffic between regions during partial
  # outages.
  cooldownSeconds: 60

  # Maximum time allowed for the complete failover to complete. The issue
  # requires total global traffic routing to the passive cluster within
  # 60 seconds.
  maxFailoverSeconds: 60

  # Primary cluster configuration.
  primary:
    # Human-readable name of the primary cluster region.
    region: "us-east-1"
    # Health endpoints that the global watcher polls.
    healthEndpoints:
      - "https://primary.stellar.org/health"
      - "https://primary.stellar.org/health"
    # Patroni REST API endpoint for the primary PostgreSQL cluster.
    patroniEndpoint: "https://patroni-primary.stellar.org"

  # Passive cluster configuration.
  passive:
    # Human-readable name of the passive cluster region.
    region: "us-west-2"
    # Health endpoints that the global watcher polls.
    healthEndpoints:
      - "https://passive.stellar.org/health"
    # Patroni REST API endpoint for the passive PostgreSQL cluster.
    patroniEndpoint: "https://patroni-passive.stellar.org"

  # Global DNS manager configuration.
  dns:
    # DNS provider to use. Supported values: route53, cloudflare.
    provider: "route53"
    # The global domain to remap during failover.
    domain: "rpc.stellar.org"
    # DNS record TTL in seconds. Kept low to ensure fast propagation.
    ttl: 30
    # Route53 hosted zone ID. Required when provider is route53.
    hostedZoneId: ""
    # Cloudflare zone ID. Required when provider is cloudflare.
    zoneId: ""
    # Name of the Kubernetes Secret containing the cloud API credentials.
    credentialsSecretName: ""
    # Key within the credentials Secret holding the API token/keys.
    credentialsSecretKey: "credentials"

  # Patroni database promotion configuration.
  database:
    # Whether the operator should automatically promote the Patroni replica.
    autoPromote: true
    # Name of the Patroni cluster to promote.
    clusterName: "stellar-postgres"
    # Timeout in seconds for the promotion API call.
    promoteTimeoutSeconds: 30

  # Metrics port for the failover operator.
  metricsPort: 9103

  # Resource requests/limits for the failover operator pod.
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# SCP Analytics / Kafka streaming (disabled by default)
scpAnalytics:
  enabled: false

# Horizon HPA (disabled by default)
horizonHpa:
  enabled: false

# Byzantine Watcher (disabled by default)
byzantineWatcher:
  enabled: false

# GitOps Secrets (SOPS/SealedSecrets injection, disabled by default)
gitopsSecrets:
  enabled: false
  tmpfsSizeLimit: "16Mi"
  mountPath: "/var/run/stellar/gitops-secrets"

# Cross-region failover settings (disabled by default)
crossRegion:
  enabled: false

# Feature flags (runtime toggles)
featureFlags:
  rollouts: false

# Extra pod annotations
extraAnnotations: {}

# OTel Collector sidecar (disabled by default)
# otel.collector sub-section — main otel.enabled is defined above
# These are evaluated only when otel.collector.enabled is true

# Monitoring stack (Prometheus/ServiceMonitor, disabled by default)
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
    certAlerts: false

# Horizon HPA (auto-scaling for Horizon nodes, disabled by default)
horizonHpa:
  enabled: false
  namespace: "stellar"
  stellarNodeName: ""
  targetDeployment: ""
  minReplicas: 1
  maxReplicas: 10
  tpsTargetPerReplica: 100
  queueLengthTarget: 10
  scaleUpStabilizationSeconds: 60
  scaleDownStabilizationSeconds: 300

# Byzantine Watcher (cross-node anomaly detection, disabled by default)
byzantineWatcher:
  enabled: false
  defaultNetwork: "testnet"
  logLevel: "info"
  metricsPort: 9091
  pollIntervalSecs: 30
  requestTimeoutSecs: 10
  regions: []
  image:
    repository: "ghcr.io/otowoorg/stellar-k8s/byzantine-watcher"
    tag: "latest"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# SCP Analytics / Kafka streaming (disabled by default)
scpAnalytics:
  enabled: false
  kafka:
    brokers: []
    topic: "stellar-scp"
  consumer:
    groupId: "stellar-scp-consumer"
