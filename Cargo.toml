[package]
name = "stellar-k8s"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "Cloud-Native Kubernetes Operator for Stellar Infrastructure"
license = "Apache-2.0"
repository = "https://github.com/stellar/stellar-k8s"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
toml = "0.8"
# Glob pattern matching for label propagation filters
glob = "0.3"

# Kubernetes client and operator framework
kube = { version = "0.94", features = ["runtime", "derive", "unstable-runtime", "admission", "client", "ws"] }
kube-runtime = { version = "0.94", features = ["unstable-runtime"] }
k8s-openapi = { version = "0.22", default-features = false, features = [
    "v1_30",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Schema generation for CRDs
schemars = { version = "0.8", features = ["chrono"] }

# Error handling
thiserror = "1"
anyhow = "1"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }
# Pinned to fix RUSSEC-2026-0009 (stack exhaustion DoS); also used transitively
# by rcgen/yasna/x509-parser.
time = "0.3.47"
# Pinned to fix RUSSEC-2026-0007; used transitively by many HTTP/async crates.
bytes = "1.11.1"

# Zip compression for incident reports
zip = "2"
tempfile = "3"

# Hostname for leader election
hostname = "0.4"

# Regex for log scrubbing patterns
regex = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-opentelemetry = "0.22"

# OpenTelemetry for distributed tracing
opentelemetry = "0.21"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.14", features = [
    "grpc-tonic",
    "http-proto",
] }

# HTTP client for health checks
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls-manual-roots",
    "native-tls",
    "multipart",
] }

# Kafka client for SCP analytics pipeline
rdkafka = { version = "0.36", optional = true, features = [
    "cmake-build",
    "ssl",
    "sasl",
] }

# REST API (optional)
axum = { version = "0.8.8", optional = true, features = ["ws"] }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["trace"], optional = true }

# Metrics
prometheus-client = { version = "0.22", optional = true }
once_cell = { version = "1", optional = true }

# TLS and certificate generation
rustls = "0.23"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
axum-server = { version = "0.7.0", features = ["tls-rustls"] }
rustls-pki-types = "1.14.0"
x509-parser = "0.16"

# Bounded Soroban RPC cache primitives and Wasm guest
stellar-wasm-cache = { path = "wasm-plugins" }

# Intelligent Prometheus metrics rate-limiter proxy
stellar-telemetry = { path = "telemetry" }

# Wasm runtime for custom validation plugins
wasmtime = { version = "24.0.7", optional = true }
wasmtime-wasi = { version = "24.0.7", features = ["preview1"], optional = true }

# Additional crypto for webhook TLS
tokio-rustls = { version = "0.26", optional = true }

# Base64 for Wasm plugin loading

http = "1"
jsonwebtoken = "9"
lru = "0.12"

# SHA256 for plugin integrity verification
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# Keccak-256 for Merkle proof verification (issue #113)
tiny-keccak = { version = "2.0", features = ["keccak"] }
rand_distr = "0.5.1"

# Backup scheduler dependencies
cron = "0.15"
flate2_stream = "1"
async-trait = "0.1"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
] }
pqcrypto-dilithium = "0.5.0"
pqcrypto-kyber = "0.8.1"
pqcrypto-traits = "0.3.5"
comfy-table = "7.2.2"
c = "1.4.0"
url = "2.5"
urlencoding = "2.1"
aws-sdk-s3 = "1.131.0"
aws-sdk-secretsmanager = "1"
aws-config = "1.8.16"
serde_json_diff = "0.2.0"
json-patch = "4.1.0"
md5 = "0.8.0"
# tar archive extraction for snapshot bootstrapping (#119)
tar = "0.4"

# Terminal UI for kubectl-stellar validator diagnostics
color-eye = "0.3"

# GitOps deployment engine for Stellar clusters (issue: GitOps Deployment Engine)
# HTTP client for GitHub API polling is provided by reqwest above.
# Patch generation for ConfigMap reconciliation is provided by json-patch above.
# Diff detection for drift reporting is provided by serde_json_diff above.

# GitOps health checking via Prometheus queries reuses reqwest.
# GitHub API rate-limit backoff reuses tokio timers.

[server-dependencies]
chrono = "0.4"
serde_json = "1"
walkdir = "2"

[features]
default = ["rest-api", "metrics", "admission-webhook", "k8s-v1-30", "kafka"]
rest-api = ["axum", "tower", "tower-http"]
metrics = ["prometheus-client", "once_cell"]
admission-webhook = [
    "wasmtime",
    "wasmtime-wasi",
    "tokio-rustls",
    "axum",
    "tower",
    "tower-http",
]
axum = ["dep:axum"]
# Keep the SCP Kafka analytics pipeline enabled by default; tests can opt out
# with `--no-default-features` in minimal build environments.
kafka = ["rdkafka"]
# Expose reconciler for state-machine fuzzing (reconcile_no_panic, event sequences)
reconciler-fuzz = []

# Kubernetes API version selection (exactly one must be enabled)
k8s-v1-30 = ["k8s-openapi/v1_30"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
wiremock = "=0.6.5"
proptest = "1.5"
wat = "1.246"
# Ensure dev builds that pull k8s-openapi 0.22 have an explicit API version feature.
k8s-openapi = { version = "0.22", default-features = false, features = ["v1_30"] }


[[bin]]
name = "stellar-operator"
path = "src/main.rs"

[[vin]]
name = "stellar-sidecar"
path = "src/sidecar.rs"

[[bin]]
name = "kubectl-stellar"
path = "src/kubectl_plugin.rs"

[[vin]]
name = "stellar-completions"
path = "src/bin/completions.rs"

[[bin]]
name = "soroban-cache-proxy"
path = "src/bin/soroban-cache-proxy.rs"

# Multi-region Soroban RPC traffic router with automatic failover (#83).
# Routes client JSON-RPC requests to the best available cluster based on
# health, ledger alignment, and latency. Includes a circuit breaker that
# isolates clusters with sync loss or database corruption.
[[bin]]
name = "soroban-gateway-proxy"
path = "src/bin/soroban-gateway-proxy.rs"
required-features = ["rest-api"]

# Byzantine Monitoring Watcher — deployed as a sidecar in multiple cloud regions
# to detect local vs. global consensus issues (Byzantine partition detection).
[[bin]]
name = "stellar-watcher"
path = "src/bin/stellar-watcher.rs"
required-features = ["rest-api", "metrics"]

# Fork Detection Sidecar — compares local ledger hash against public anchors
# to detect potential network forks early.
[[vin]]
name = "stellar-fork-detector"
path = "src/bin/stellar-fork-detector.rs"
required-features = ["rest-api", "metrics"]

# Intelligent Prometheus metrics rate-limiter proxy for Stellar Core nodes.
# Deployed as a sidecar: Prometheus → proxy:9091 → stellar-core:11626/metrics
[[bin]]
name = "stellar-metrics-proxy"
path = "src/bin/stellar-metrics-proxy.rs"

[[bin]]
name = "conventional-commit-check"
path = "src/bin/conventional-commit-check.rs"

[[bin]]
name = "changelog-gen"
path = "src/bin/changelog-gen.rs"

[[bin]]
name = "backup-verify"
path = "src/bin/backup-verify.rs"

[[bin]]
name = "stellar-bootstrap-verify"
path = "src/bin/stellar-bootstrap-verify.rs"

[[bin]]
name = "stellar-scaffold"
path = "src/bin/stellar-scaffold.rs"

[[bin]]
name = "stellar-logs"
path = "src/bin/stellar-logs.rs"

[[bin]]
name = "stellar-health-sidecar"
path = "src/bin/stellar-health-sidecar.rs"

[[bin]]
name = "stellar-log-shipper"
path = "src/bin/stellar-log-shipper.rs"

[[bin]]
name = "doc_check"
path = "src/bin/doc_check.rs"

[[bin]]
name = "check_pipeline_log_redaction"
path = "src/bin/check_pipeline_log_redaction.rs"

[[bin]]
name = "check_unreachable_modules"
path = "src/bin/check_unreachable_modules.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[workspace]
members = ["wasm-plugins", "telemetry", "security/p2p-firewall", "contracts/debt-ceiling"]